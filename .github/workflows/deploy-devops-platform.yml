# Continuous deployment for the DevOps Practice Platform → Azure Container Apps.
#
# Runs on every push to master that touches the app. Builds the api and web
# images in Azure Container Registry and rolls the two Container Apps to the new
# images. Assumes the stack already exists (create it once with
# devops-practice-platform/deploy/deploy.sh).
#
# One-time setup on the repository:
#   Secrets (Settings ▸ Secrets and variables ▸ Actions ▸ Secrets):
#     AZURE_CLIENT_ID        - app registration (federated/OIDC) client id
#     AZURE_TENANT_ID        - Azure AD tenant id
#     AZURE_SUBSCRIPTION_ID  - target subscription id
#   Variables (… ▸ Variables):
#     ACR_NAME               - the registry name printed by deploy.sh
#
# The OIDC service principal needs Contributor + AcrPush on the resource group.
# Migrations run automatically on API startup; the content seed is intentionally
# NOT run here (it reloads content and would reset learner progress). Re-seed
# manually after content changes:
#   az containerapp exec -n devops-api -g devops-platform-rg --command "npm run seed"

name: Deploy DevOps Platform to Azure

on:
  push:
    branches: [master]
    paths:
      - 'devops-practice-platform/**'
      - '.github/workflows/deploy-devops-platform.yml'
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC login
  contents: read

env:
  RESOURCE_GROUP: devops-platform-rg
  ACR_NAME: ${{ vars.ACR_NAME }}
  API_APP: devops-api
  WEB_APP: devops-web

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag
        run: echo "TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Resolve ACR login server
        run: echo "ACR_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)" >> "$GITHUB_ENV"

      - name: Build API image in ACR
        run: |
          az acr build -r "$ACR_NAME" -t "devops-api:$TAG" \
            -f devops-practice-platform/server/Dockerfile devops-practice-platform

      - name: Deploy API
        run: |
          az containerapp update -n "$API_APP" -g "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/devops-api:$TAG"

      - name: Resolve API URL
        run: |
          echo "API_FQDN=$(az containerapp show -n "$API_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_ENV"

      - name: Build web image in ACR (bake API URL)
        run: |
          az acr build -r "$ACR_NAME" -t "devops-web:$TAG" \
            --build-arg VITE_API_BASE_URL="https://$API_FQDN/api" \
            devops-practice-platform/web

      - name: Deploy web
        run: |
          az containerapp update -n "$WEB_APP" -g "$RESOURCE_GROUP" \
            --image "$ACR_SERVER/devops-web:$TAG"

      - name: Summary
        run: |
          WEB_FQDN=$(az containerapp show -n "$WEB_APP" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "### Deployed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "- Web: https://$WEB_FQDN" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: https://$API_FQDN/api" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image tag: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
