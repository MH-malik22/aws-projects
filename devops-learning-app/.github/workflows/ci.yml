# CI/CD for the DevOps Learning App itself (the app dogfoods module 10).
# Fail-fast ordering: cheap validation → tests → builds → (main only) image publish.

name: devops-learning-app-ci

on:
  push:
    branches: [main, master]
    paths: ["devops-learning-app/**"]
  pull_request:
    paths: ["devops-learning-app/**"]

defaults:
  run:
    working-directory: devops-learning-app

jobs:
  validate-content:
    name: Validate curriculum content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Validate quiz/lab JSON and module structure
        run: python scripts/validate_content.py

  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: devops-learning-app/backend/requirements.txt
      - run: pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend/app
      - name: Unit tests
        run: cd backend && python -m pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: devops-learning-app/frontend/package.json
      - run: cd frontend && npm install
      - run: cd frontend && npm run build

  images:
    name: Build & push images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: devops-learning-app/backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/devops-academy-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: devops-learning-app/frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/devops-academy-web:${{ github.sha }}

  # Continuous delivery: deploy job stays a manual gate (environment protection rule).
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: images
    if: github.event_name == 'push'
    environment: staging
    steps:
      - name: Deploy (placeholder)
        run: |
          echo "helm upgrade --install devops-academy ./chart \
            --set api.image.tag=${{ github.sha }} \
            --set web.image.tag=${{ github.sha }} --atomic"
