services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devops}
      POSTGRES_DB: ${POSTGRES_DB:-devops_platform}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devops}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-devops}:${POSTGRES_PASSWORD:-devops}@db:5432/${POSTGRES_DB:-devops_platform}
      PORT: 4000
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    # Run migrations + seed on boot, then start the API.
    command: sh -c "npm run setup && npm start"

  web:
    build: ./web
    environment:
      # Baked at build time; see web/Dockerfile
      VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
