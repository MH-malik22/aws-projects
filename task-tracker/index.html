<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker with Auto Reminders</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="container">
      <h1>Task Tracker</h1>
      <p class="subtitle">Track your day and get auto-reminded before you forget.</p>
      <div class="header-actions">
        <button id="enable-notifications" class="btn btn-secondary">Enable Notifications</button>
        <span id="notification-status" class="status-pill">Status: unknown</span>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Add a Task</h2>
      <form id="task-form" class="task-form">
        <div class="form-row">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="e.g. Review pull request" required />
        </div>

        <div class="form-row">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="2" placeholder="Optional details..."></textarea>
        </div>

        <div class="form-grid">
          <div class="form-row">
            <label for="dueAt">Due date &amp; time</label>
            <input type="datetime-local" id="dueAt" name="dueAt" required />
          </div>

          <div class="form-row">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-row">
            <label for="category">Category</label>
            <input type="text" id="category" name="category" placeholder="Work, Personal..." />
          </div>

          <div class="form-row">
            <label for="repeat">Repeat</label>
            <select id="repeat" name="repeat">
              <option value="none" selected>Does not repeat</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>

          <div class="form-row">
            <label for="remindBefore">Remind me (minutes before)</label>
            <input type="number" id="remindBefore" name="remindBefore" min="0" step="1" value="10" />
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Add Task</button>
          <button type="reset" class="btn btn-ghost">Reset</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Your Tasks</h2>
        <div class="filters">
          <label for="filter">Show:</label>
          <select id="filter">
            <option value="all">All</option>
            <option value="pending" selected>Pending</option>
            <option value="completed">Completed</option>
            <option value="overdue">Overdue</option>
            <option value="today">Due today</option>
          </select>
          <button id="clear-completed" class="btn btn-ghost">Clear completed</button>
        </div>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state" hidden>No tasks to show. Add one above!</p>
    </section>
  </main>

  <footer class="app-footer">
    <div class="container">
      <small>Tasks are stored locally in your browser. Keep this tab open for reminders to fire.</small>
    </div>
  </footer>

  <script src="js/storage.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
